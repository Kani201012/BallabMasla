<style>
:root {
    --primary: #991b1b; /* Rich Saffron Crimson */
    --primary-hover: #7f1d1d;
    --gold: #df9b26; /* Pure Turmeric Gold */
    --gold-light: #fef3c7;
    --dark: #141210; /* Roasted Peppercorn Charcoal */
    --bg: #fdfbf7; /* Warm Natural Stone Cream */
    --card-bg: #ffffff;
    --text-heading: #1c1917;
    --text-body: #44403c;
    --border-color: rgba(223, 155, 38, 0.2);
    --shadow-soft: 0 10px 30px -5px rgba(20, 18, 16, 0.06);
    --shadow-elevated: 0 20px 40px -10px rgba(153, 27, 27, 0.15);
    --radius: 16px;
    --font-display: 'Cinzel', serif;
    --font-serif: 'Playfair Display', serif;
    --font-sans: 'Plus Jakarta Sans', sans-serif;
}

.dark-mode {
    --bg: #0f0d0c;
    --card-bg: #1a1715;
    --text-heading: #fef08a;
    --text-body: #d6d3d1;
    --border-color: rgba(223, 155, 38, 0.25);
    --shadow-soft: 0 10px 30px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }

body { 
    background: var(--bg); 
    color: var(--text-body); 
    font-family: var(--font-sans); 
    line-height: 1.75; 
    overflow-x: hidden; 
    transition: background 0.4s ease, color 0.4s ease;
}

h1, h2, h3, h4 { 
    font-family: var(--font-display); 
    color: var(--text-heading); 
    line-height: 1.2; 
    letter-spacing: -0.01em;
}

.serif-accent {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
}

.container { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }

/* Top Announcement Bar */
#top-bar {
    background: linear-gradient(90deg, #991b1b, #b45309, #991b1b);
    background-size: 200% 200%;
    animation: gradientShift 10s ease infinite;
    color: #ffffff;
    text-align: center;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    position: relative;
    z-index: 2001;
}
#top-bar a { color: #fef08a; text-decoration: underline; font-weight: 700; margin-left: 8px; }
@keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

/* Glass Navbar */
nav#main-navbar { 
    position: sticky; top: 0; width: 100%; z-index: 2000;
    background: rgba(253, 251, 247, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-color);
    transition: all 0.3s;
}
.dark-mode nav#main-navbar {
    background: rgba(15, 13, 12, 0.92);
}
.nav-flex { display: flex; justify-content: space-between; align-items: center; height: 75px; }

.brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
}
.brand-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--gold), var(--primary));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 1.1rem;
    box-shadow: 0 4px 12px rgba(223, 155, 38, 0.4);
}
.brand-name {
    font-family: var(--font-display);
    font-size: 1.45rem;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: 0.05em;
}
.dark-mode .brand-name { color: var(--gold); }

.nav-links { display: flex; align-items: center; gap: 2rem; }
.nav-links a { 
    text-decoration: none; 
    font-weight: 600; 
    color: var(--text-body); 
    font-size: 0.95rem; 
    transition: 0.25s; 
    position: relative; 
}
.nav-links a:hover { color: var(--primary); }
.nav-links a::after {
    content: ''; position: absolute; width: 0; height: 2px;
    bottom: -4px; left: 0; background: var(--primary); transition: 0.3s;
}
.nav-links a:hover::after { width: 100%; }

.mobile-menu { display: none; font-size: 1.7rem; cursor: pointer; background: none; border: none; color: var(--text-heading); }

/* Buttons */
.btn { 
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0.9rem 1.8rem; border-radius: 50px; 
    font-weight: 700; text-decoration: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer; border: none; font-size: 0.92rem; letter-spacing: 0.03em;
}
.btn-primary { 
    background: linear-gradient(135deg, var(--primary), #b91c1c); 
    color: #ffffff !important; 
    box-shadow: 0 8px 20px rgba(153, 27, 27, 0.28); 
}
.btn-primary:hover { 
    transform: translateY(-2px); 
    box-shadow: 0 12px 28px rgba(153, 27, 27, 0.38); 
    filter: brightness(1.08);
}
.btn-gold {
    background: linear-gradient(135deg, var(--gold), #ca8a04);
    color: #ffffff !important;
    box-shadow: 0 8px 20px rgba(223, 155, 38, 0.3);
}
.btn-gold:hover { transform: translateY(-2px); filter: brightness(1.1); }
.btn-outline {
    border: 2px solid var(--primary);
    background: transparent;
    color: var(--primary) !important;
}
.btn-outline:hover {
    background: var(--primary);
    color: #ffffff !important;
}

/* Hero Section */
.hero {
    position: relative;
    padding: 4rem 0 6rem 0;
    overflow: hidden;
}
.hero-grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 3.5rem;
    align-items: center;
}
.badge-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--gold-light);
    color: #92400e;
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 1.2rem;
    border: 1px solid rgba(223, 155, 38, 0.3);
}
.dark-mode .badge-pill { background: rgba(223, 155, 38, 0.15); color: #fef08a; }

.hero h1 {
    font-size: clamp(2.4rem, 4.5vw, 3.8rem);
    font-weight: 800;
    margin-bottom: 1.2rem;
    line-height: 1.15;
}
.hero h1 span {
    color: var(--primary);
}
.hero p {
    font-size: 1.15rem;
    color: var(--text-body);
    margin-bottom: 2rem;
    max-width: 580px;
}
.hero-cta-group { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2.5rem; }

.hero-features-strip {
    display: flex;
    gap: 1.8rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-color);
}
.strip-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-body);
}
.strip-icon { color: var(--gold); }

.hero-media-wrapper {
    position: relative;
}
.hero-image-frame {
    width: 100%;
    height: 520px;
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 25px 60px -15px rgba(20, 18, 16, 0.2);
    border: 6px solid var(--card-bg);
}
.hero-image-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.floating-seal {
    position: absolute;
    bottom: -20px;
    left: -20px;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 1.2rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    border: 1px solid var(--border-color);
}
.floating-seal strong { font-size: 1.8rem; color: var(--primary); font-family: var(--font-display); line-height: 1; }
.floating-seal span { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-body); }

/* Heat Spectrum Interactive Bar */
.heat-spectrum-section {
    background: linear-gradient(180deg, rgba(223, 155, 38, 0.06) 0%, transparent 100%);
    padding: 3rem 0;
    margin-top: 1rem;
}
.spectrum-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin-top: 2rem;
}
.heat-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 1.8rem;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
}
.heat-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-elevated);
}
.heat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
}
.heat-card.assam::before { background: #ea580c; }
.heat-card.fotki::before { background: #dc2626; }
.heat-card.bullet::before { background: #7f1d1d; }

.flame-indicator { font-size: 1.4rem; margin-bottom: 0.8rem; }
.heat-level-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.4rem; color: var(--text-heading); }
.heat-scoville { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); margin-bottom: 0.8rem; }
.heat-desc { font-size: 0.9rem; color: var(--text-body); line-height: 1.6; }

/* Features Grid */
.features-section { padding: 6rem 0; }
.section-title { text-align: center; max-width: 720px; margin: 0 auto 4rem auto; }
.section-title h2 { font-size: clamp(2rem, 3.5vw, 2.8rem); margin-bottom: 0.8rem; }
.section-title p { font-size: 1.05rem; opacity: 0.85; }

.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
.pillar-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 2.2rem;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-soft);
    transition: all 0.3s ease;
}
.pillar-card:hover {
    transform: translateY(-5px);
    border-color: var(--gold);
    box-shadow: var(--shadow-elevated);
}
.pillar-icon-box {
    width: 58px; height: 58px;
    background: rgba(223, 155, 38, 0.12);
    color: var(--primary);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1.4rem;
}
.pillar-card h3 { font-size: 1.25rem; margin-bottom: 0.8rem; }
.pillar-card p { font-size: 0.95rem; color: var(--text-body); line-height: 1.65; }

/* Store Section */
.store-section {
    background: rgba(223, 155, 38, 0.03);
    padding: 6rem 0;
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
}
.store-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 2.5rem;
}
.filter-pills { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.filter-pill {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 0.5rem 1.2rem;
    border-radius: 50px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    color: var(--text-body);
}
.filter-pill.active, .filter-pill:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.search-input-box {
    position: relative;
    min-width: 260px;
}
.search-input-box input {
    width: 100%;
    padding: 0.65rem 1.2rem;
    border-radius: 50px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-heading);
    font-family: inherit;
    outline: none;
}

/* Product Card */
.product-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    transition: all 0.35s ease;
}
.product-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 45px -10px rgba(0,0,0,0.12);
    border-color: var(--gold);
}
.product-img-box {
    position: relative;
    height: 250px;
    overflow: hidden;
    background: #f5f0ea;
}
.product-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}
.product-card:hover .product-img-box img {
    transform: scale(1.06);
}
.purity-tag {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(20, 18, 16, 0.75);
    color: #fef08a;
    backdrop-filter: blur(4px);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 50px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.product-body {
    padding: 1.6rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}
.product-title {
    font-size: 1.3rem;
    margin-bottom: 0.4rem;
    color: var(--text-heading);
}
.product-price {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 0.8rem;
}
.product-desc {
    font-size: 0.9rem;
    color: var(--text-body);
    line-height: 1.6;
    margin-bottom: 1.5rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.product-actions {
    margin-top: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
}

/* About Teaser */
.about-section { padding: 6rem 0; }
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
.about-image-stack { position: relative; }
.about-main-img {
    width: 100%;
    height: 480px;
    object-fit: cover;
    border-radius: 24px;
    box-shadow: var(--shadow-soft);
}

/* FAQ Section */
.faq-section { padding: 5rem 0; max-width: 860px; margin: 0 auto; }
details {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    margin-bottom: 1rem;
    padding: 1.2rem 1.6rem;
    cursor: pointer;
    transition: all 0.25s ease;
}
details[open] {
    border-color: var(--gold);
    box-shadow: var(--shadow-soft);
}
details summary {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-heading);
    outline: none;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
details summary::-webkit-details-marker { display: none; }
details summary::after { content: '+'; font-size: 1.5rem; color: var(--gold); font-weight: 400; transition: transform 0.2s; }
details[open] summary::after { content: '−'; }
details p {
    margin-top: 1rem;
    font-size: 0.98rem;
    color: var(--text-body);
    line-height: 1.7;
}

/* Slide-out Cart Drawer */
#cart-drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 4000;
    opacity: 0;
    visibility: hidden;
    transition: 0.3s;
}
#cart-drawer-overlay.active { opacity: 1; visibility: visible; }

#cart-drawer {
    position: fixed; top: 0; right: -450px;
    width: 100%; max-width: 440px; height: 100vh;
    background: var(--card-bg);
    z-index: 4001;
    box-shadow: -10px 0 40px rgba(0,0,0,0.25);
    display: flex; flex-direction: column;
    transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    padding: 2rem;
}
#cart-drawer.active { right: 0; }
.cart-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 1.2rem;
    border-bottom: 1px solid var(--border-color);
}
.cart-items-container {
    flex-grow: 1;
    overflow-y: auto;
    padding: 1.5rem 0;
}
.cart-drawer-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 0;
    border-bottom: 1px solid rgba(128,128,128,0.1);
}
.item-controls {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(128,128,128,0.08);
    border-radius: 50px; padding: 2px 10px;
}
.item-btn {
    background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--text-heading); font-weight: bold;
}
.cart-footer {
    border-top: 1px solid var(--border-color);
    padding-top: 1.5rem;
}
.cart-total-row {
    display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 800; margin-bottom: 1.5rem; color: var(--text-heading);
}

/* Toast Notification */
#toast-notification {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #141210; color: #fff;
    padding: 14px 24px; border-radius: 50px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    z-index: 5000;
    font-weight: 600; font-size: 0.95rem;
    display: flex; align-items: center; gap: 10px;
    opacity: 0; pointer-events: none;
    transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#toast-notification.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1; pointer-events: auto;
}

/* Floating Cart & WhatsApp Widgets */
#cart-trigger-btn {
    position: fixed; bottom: 100px; right: 28px;
    background: var(--gold); color: #fff;
    padding: 14px 22px; border-radius: 50px;
    box-shadow: 0 8px 25px rgba(223, 155, 38, 0.45);
    cursor: pointer; z-index: 1000;
    display: none; align-items: center; gap: 10px;
    font-weight: 800; font-size: 0.95rem;
    transition: transform 0.3s;
}
#cart-trigger-btn:hover { transform: scale(1.05); }

#wa-widget { 
    position: fixed; bottom: 28px; right: 28px; 
    background: #25D366; width: 56px; height: 56px; 
    border-radius: 50%; display: flex; align-items: center; justify-content: center; 
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4); z-index: 999; 
    transition: transform 0.3s; text-decoration: none; 
}
#wa-widget:hover { transform: scale(1.1); }

#theme-toggle {
    position: fixed; bottom: 28px; left: 28px;
    width: 48px; height: 48px;
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-soft); cursor: pointer; z-index: 999;
    font-size: 1.3rem; transition: transform 0.3s;
}
#theme-toggle:hover { transform: scale(1.1) rotate(15deg); }

/* Footer */
footer {
    background: #0d0b0a;
    color: #d6d3d1;
    padding: 5rem 0 2rem 0;
    border-top: 4px solid var(--gold);
}
.footer-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 3rem;
    margin-bottom: 4rem;
}
footer h4 { color: #ffffff; font-size: 1.15rem; margin-bottom: 1.4rem; }
footer a { color: #a8a29e; text-decoration: none; display: block; margin-bottom: 0.8rem; transition: 0.25s; }
footer a:hover { color: var(--gold); transform: translateX(3px); }
.social-links { display: flex; gap: 12px; margin-top: 1.5rem; }
.social-links a {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    transition: 0.3s;
}
.social-links a:hover { background: var(--primary); transform: translateY(-3px); }
.social-links svg { width: 18px; height: 18px; fill: #ffffff; }

/* Responsive */
@media (max-width: 992px) {
    .hero-grid, .about-grid, .spectrum-grid { grid-template-columns: 1fr; gap: 2.5rem; }
    .hero-image-frame { height: 380px; }
    .floating-seal { bottom: 10px; left: 10px; }
